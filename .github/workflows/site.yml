# Rebuilds canopy.spinney.dev when the documentation changes. The site is
# built on Cloudflare Pages from its own repository, and each build clones
# canopy's main for the docs; this asks for a build through the Pages
# project's deploy hook.
#
# Setting it up, once: in Cloudflare, the canopy.spinney.dev Pages project,
# Settings, Builds, Deploy hooks, add one for the main branch; then save its
# URL here as a repository secret:
#
#   gh secret set SITE_DEPLOY_HOOK --repo spinneydev/canopy
#
# Any markdown counts, not just the documents the site lists, so a document
# it adds later is covered too. Run it by hand from Actions, Site, Run
# workflow.
name: Site

on:
  push:
    branches: [main]
    paths: ["**.md"]
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - name: Ask Cloudflare Pages for a build
        env:
          HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
        run: |
          [ -n "$HOOK" ] || { echo "no SITE_DEPLOY_HOOK secret; see the top of .github/workflows/site.yml"; exit 1; }
          curl -fsS -X POST "$HOOK" -o /dev/null
